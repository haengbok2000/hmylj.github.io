데이터는 운영자 PC에만 저장되고 제3자에게 제공되지 않습니다.</p>
<h2 id="terms">서비스 약관</h2>
<p>이 앱은 운영자 개인 용도로만 사용되며 다른 사용자에게 서비스를 제공하지 않습니다.</p>
